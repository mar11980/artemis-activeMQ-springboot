services:

  postgres:
    image: postgres:18
    container_name: postgres-artemis

    environment:
      POSTGRES_DB: vaudoise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lambda

    ports:
      - "5432:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql
      #      - ./db/schema.sqleee:/docker-entrypoint-initdb.d/schema.sqleee
      - ./db/data.sql:/docker-entrypoint-initdb.d/data.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"

  my-artemisMQ-service:
    build: .
    container_name: messaging-artemis
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar

    ports:
      - "8080:8080"

    environment:
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: kafka-service

      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vaudoise
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: lambda
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_SQL_INIT_MODE: always
      #      SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:db/schema.sqleee
      SPRING_SQL_INIT_DATA_LOCATIONS: classpath:db/data.sql

      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"

      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"

    restart: unless-stopped

volumes:
  postgres_data: